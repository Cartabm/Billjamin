[plugin]

name="Unused Resource Finder"
description="Audits your whole project in one pass: lists image, audio, font and resource files that nothing references (checked by both res:// path and uid://, so a resource used only via uid is never wrongly flagged), and separately flags images over 2048px on a side that commonly bloat exports. Shows file size and dimensions, lets you reveal each one in your file manager, and exports both lists as one Markdown report."
author="Kurtis Klay"
version="1.1.0"
script="plugin.gd"
